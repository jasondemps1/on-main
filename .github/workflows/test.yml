name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and Emacs (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl emacs

      - name: Install SBCL and Emacs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sbcl emacs-nox

      - name: Fetch Sly and SLIME
        run: make deps

      - name: Test
        run: make test
